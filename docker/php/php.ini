[PHP]
; Este archivo es para configuraciones ADICIONALES del contenedor Docker
; Las extensiones ya están instaladas en el Dockerfile
; NO definir extension_dir ni extensiones aquí - ya están en el contenedor

; Maximum execution time
max_execution_time = 300

; Maximum input time
max_input_time = 300

; Maximum amount of memory
memory_limit = 256M

; Maximum POST size
post_max_size = 64M

; Maximum upload file size
upload_max_filesize = 64M

; Maximum number of files
max_file_uploads = 20

; Display errors (only for development)
display_errors = On
display_startup_errors = On

; Error reporting level
error_reporting = E_ALL

; Log errors
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = America/Bogota

; Session settings
session.gc_maxlifetime = 1440
session.cookie_httponly = 1

; OPcache settings
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; Xdebug settings (development only)
[xdebug]
xdebug.mode = develop,debug,coverage
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log = /tmp/xdebug.log