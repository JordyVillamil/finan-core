version: '3.8'

services:
  # ============================================
  # NGINX - Web Server
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: proyecto-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - proyecto-network
    restart: unless-stopped

  # ============================================
  # PHP-FPM - Laravel Backend
  # ============================================
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: proyecto-php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=proyecto_contable
      - DB_USERNAME=proyecto_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
    depends_on:
      - postgres
      - redis
    networks:
      - proyecto-network
    restart: unless-stopped

  # ============================================
  # React Frontend
  # ============================================
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    container_name: proyecto-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost/api
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    networks:
      - proyecto-network
    restart: unless-stopped

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: proyecto-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: proyecto_contable
      POSTGRES_USER: proyecto_user
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - proyecto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecto_user -d proyecto_contable"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis - Cache & Queues
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: proyecto-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - proyecto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # Mailhog - Email Testing
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: proyecto-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - proyecto-network
    restart: unless-stopped

  # ============================================
  # Redis Commander - Redis GUI (Optional)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: proyecto-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - proyecto-network
    restart: unless-stopped
    profiles:
      - tools

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  proyecto-network:
    driver: bridge